name: Build Android APK

on:
  push:
    branches:
      - claude/vampire-survivors-android-bakwcu
    paths:
      - "android-game/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android-game
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
             "mega-survivors-v0.2.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mega-survivors-v0.2.${{ github.run_number }}
          path: android-game/mega-survivors-v0.2.${{ github.run_number }}.apk
          retention-days: 30
